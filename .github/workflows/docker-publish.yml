# Build + push multi-arch Docker image to GitHub Container Registry on release.
# Triggered on every v*.*.* tag push.

name: Docker — Build and Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      restore_latest_from:
        description: "Restore latest from an existing stable X.Y.Z image (no rebuild)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/safecadence-netrisk

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        if: ${{ inputs.restore_latest_from == '' }}
        id: meta
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          fi
          TAGS="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          # Alphas/betas/RCs must never move the stable container alias.
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAGS="$TAGS,${REGISTRY}/${IMAGE_NAME}:latest"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Restore stable latest alias without rebuilding
        if: ${{ inputs.restore_latest_from != '' }}
        env:
          RESTORE_TAG: ${{ inputs.restore_latest_from }}
        run: |
          set -euo pipefail
          [[ "$RESTORE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 2
          docker buildx imagetools create --prefer-index=false \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            "${REGISTRY}/${IMAGE_NAME}:${RESTORE_TAG}"

      - name: Build and push multi-arch image
        if: ${{ inputs.restore_latest_from == '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
